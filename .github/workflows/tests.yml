name: Tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:

  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go (the version go.mod names)
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Vet
      run: go vet ./...

    # Go 1.20's race detector (an older ThreadSanitizer) can fail on newer
    # Ubuntu runners with "unexpected memory mapping": their address-space
    # randomisation uses more bits than it supports
    - name: Fit the race detector's memory layout
      run: sudo sysctl -w vm.mmap_rnd_bits=28

    - name: Run tests (with the race detector)
      run: go test -race ./...
